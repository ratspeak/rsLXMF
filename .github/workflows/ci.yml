name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RSLXMF_RSRETICULUM_COMMIT: cfb7253f99439367212744f322b72b549a44bc62

jobs:
  api-compat:
    name: Public API baseline
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXMF
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXMF_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-08-01
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMF -> target
          cache-bin: true
      - name: Install API snapshot tool
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Check reviewed public API baseline
        run: python3 tools/check-api-baseline.py
        working-directory: rsLXMF
      - name: Check manifest and feature contract
        run: python3 tools/check-api-manifest.py
        working-directory: rsLXMF
      - name: Check additions-only compatibility floor
        run: python3 tools/check-api-compatibility.py
        working-directory: rsLXMF
      - name: Check canonical and legacy external consumer
        run: cargo check --manifest-path api-fixtures/Cargo.toml --locked
        working-directory: rsLXMF

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXMF_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMF -> target
      - name: Install system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - run: cargo test --workspace --locked
        working-directory: rsLXMF
      - name: Build embedding examples
        run: cargo build -p lxmf-core --examples --locked
        working-directory: rsLXMF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXMF_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMF -> target
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - name: Check source-release contract
        run: python3 scripts/ci/check_source_release_contract.py
        working-directory: rsLXMF
      - run: cargo fmt --all -- --check
        working-directory: rsLXMF
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: rsLXMF
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked
        working-directory: rsLXMF

  msrv:
    name: Rust 1.87 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXMF_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.87.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMF -> target
          cache-bin: false
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - name: Clippy (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: rsLXMF
