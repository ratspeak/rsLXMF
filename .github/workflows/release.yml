name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
  PACKAGE_ROOT: rsLXMF
  LXMF_BINS: lxmd-rs
  RSLXMF_RSRETICULUM_VERSION: 1.1.0
  RSLXMF_RSRETICULUM_COMMIT: ab53670f988fc15a6a3ec0207932f63b6aa65534

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXMF_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.87.0
      - name: Verify release source and dependency
        working-directory: rsLXMF
        run: python3 scripts/ci/check_source_release_contract.py --release-tag "${RELEASE_TAG}"

  build:
    name: Build ${{ matrix.artifact_suffix }}
    needs: verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            artifact_suffix: macos
            archive: tar.gz
          - os: windows-latest
            artifact_suffix: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE_NAME: rsLXMF-${{ github.event.inputs.tag_name || github.ref_name }}-${{ matrix.artifact_suffix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXMF_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.87.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXMF -> target
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - name: Build release binaries
        working-directory: rsLXMF
        run: cargo build -p lxmf-tools --release --bins --locked
      - name: Stage archive contents
        shell: bash
        working-directory: rsLXMF
        run: |
          set -euo pipefail
          mkdir -p "dist/${PACKAGE_ROOT}/bin"
          for bin in ${LXMF_BINS}; do
            if [[ "${RUNNER_OS}" == "Windows" ]]; then
              cp "target/release/${bin}.exe" "dist/${PACKAGE_ROOT}/bin/${bin}.exe"
            else
              cp "target/release/${bin}" "dist/${PACKAGE_ROOT}/bin/${bin}"
            fi
          done
          cp README.md LICENSE CHANGELOG.md RELEASING.md "dist/${PACKAGE_ROOT}/"
      - name: Create tar archive
        if: runner.os != 'Windows'
        shell: bash
        working-directory: rsLXMF
        run: tar -czf "${ARCHIVE_NAME}.tar.gz" -C dist "${PACKAGE_ROOT}"
      - name: Create zip archive
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: rsLXMF
        run: Compress-Archive -Path "dist/${env:PACKAGE_ROOT}" -DestinationPath "${env:ARCHIVE_NAME}.zip" -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            rsLXMF/*.tar.gz
            rsLXMF/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: release-assets/*
