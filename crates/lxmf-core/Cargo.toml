[package]
name = "lxmf-core"
description = "LXMF messaging protocol implementation for Reticulum"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
default = ["sqlite-store"]
# SQLite router state at lxmf/state.db, as LXMF 1.3.0 keeps it. Without it the
# router keeps that state in memory only.
sqlite-store = ["dep:rusqlite", "rns-transport/sqlite-store"]

[dependencies]
base64 = { workspace = true }
rns-crypto = { workspace = true }
rns-wire = { workspace = true }
rns-identity = { workspace = true }
rns-link = { workspace = true }
rns-protocol = { workspace = true }
rns-transport = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true, features = ["with-serde"] }
serde = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
unicode-normalization = { workspace = true }
unicode-general-category = { workspace = true }
rusqlite = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.19"

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
